name: Compilar AppParadas

# Cada cambio en main: revisa el código, corre las pruebas, publica la versión web
# en GitHub Pages y arma el APK de Android.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear carpetas de Android, iOS y web (sólo si faltan)
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ]; then
            flutter create --org mx.lzc --project-name app_paradas --platforms=android,ios,web .
            python3 herramientas/configurar_plataformas.py
            echo "NUEVAS=1" >> "$GITHUB_ENV"
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Revisar el código
        run: bash herramientas/con_resumen.sh flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: bash herramientas/con_resumen.sh flutter test

      - name: Versión web
        run: bash herramientas/con_resumen.sh flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: Preparar la página web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Capturas de pantalla (tamaño iPhone) en la rama "capturas"
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/pw && cp herramientas/capturas.mjs /tmp/pw/
          (cd /tmp/pw && npm init -y >/dev/null && npm i -s playwright@1.47.2 && npx playwright install --with-deps chromium >/dev/null)
          node /tmp/pw/capturas.mjs "$PWD/build/web" /tmp/capturas
          cd /tmp/capturas && git init -q && git checkout -q -b capturas
          git add . && git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -q -m "Capturas de ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" capturas

      - name: Guardar las carpetas de plataforma en el repo
        if: env.NUEVAS == '1' && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios web .metadata
          git commit -m "Carpetas de Android, iOS y web generadas con flutter create" || exit 0
          git push

  publicar-web:
    needs: web
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Si GitHub Pages aún no está en "GitHub Actions", este paso falla sin afectar lo demás.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Crear carpetas de Android, iOS y web (sólo si faltan)
        run: |
          if [ ! -d android ]; then
            flutter create --org mx.lzc --project-name app_paradas --platforms=android,ios,web .
            python3 herramientas/configurar_plataformas.py
          fi

      - name: APK de Android
        run: bash herramientas/con_resumen.sh flutter build apk --release

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: AppParadas-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el APK como descarga ("ultima")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AppParadas.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima AppParadas.apk \
            --title "AppParadas (última versión)" \
            --notes "APK de Android generado automáticamente desde ${GITHUB_SHA::7}. Instálalo en el teléfono permitiendo apps de origen desconocido."
