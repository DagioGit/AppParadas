name: Compilar AppParadas

# Cada cambio en main: revisa el código, corre las pruebas, arma el APK de Android
# y publica la versión web en GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: compilar
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.24.5"
          cache: true

      - name: Crear carpetas de Android, iOS y web (sólo si faltan)
        run: |
          if [ ! -d android ] || [ ! -d ios ] || [ ! -d web ]; then
            flutter create --org mx.lzc --project-name app_paradas --platforms=android,ios,web .
            python3 herramientas/configurar_plataformas.py
            echo "NUEVAS=1" >> "$GITHUB_ENV"
          fi

      - name: Dependencias
        run: flutter pub get

      - name: Revisar el código
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Pruebas
        run: flutter test

      - name: Versión web
        run: flutter build web --release --base-href "/${{ github.event.repository.name }}/"

      - name: APK de Android
        run: flutter build apk --release

      - name: Guardar las carpetas de plataforma en el repo
        if: env.NUEVAS == '1' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A android ios web .metadata
          git commit -m "Carpetas de Android, iOS y web generadas con flutter create" || exit 0
          git push

      - name: Subir el APK
        uses: actions/upload-artifact@v4
        with:
          name: AppParadas-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar el APK como descarga ("ultima")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk AppParadas.apk
          gh release delete ultima --yes --cleanup-tag || true
          gh release create ultima AppParadas.apk \
            --title "AppParadas (última versión)" \
            --notes "APK de Android generado automáticamente desde ${GITHUB_SHA::7}. Instálalo en el teléfono permitiendo apps de origen desconocido."

      - name: Preparar la página web
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  publicar-web:
    needs: compilar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Si GitHub Pages aún no está en "GitHub Actions", este paso falla sin afectar al APK.
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
